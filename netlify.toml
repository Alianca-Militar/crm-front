[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# A API passa pelo Netlify (proxy): o navegador fica sempre na mesma origem,
# então o cookie de sessão e o CSRF funcionam sem CORS (igual ao proxy do Vite em dev).
[[redirects]]
  from = "/api/*"
  to = "https://apicrm.meialuadbarreto.com.br/api/:splat"
  status = 200
  force = true

# SPA: qualquer outra rota abre o index.html e o React Router resolve.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
